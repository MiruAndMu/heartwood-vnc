name: Release check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-protocol:
    name: Mac setup and protocol checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Static release checks
        run: |
          bash -n mac-setup/heartwood-mac-setup.sh
          bash -n tests/test-mac-install.sh
          node tests/release-smoke.mjs
      - name: Bridge protocol checks
        run: python3 tests/test-vnc-bridge.py

  windows-release:
    name: Fresh Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Build portable executable
        run: npm run dist
      - name: Inspect packaged app
        run: npm run inspect:dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartwood-vnc-windows-${{ github.sha }}
          path: |
            dist/HeartwoodVNC-1.0.0.exe
            mac-setup/heartwood-mac-setup.sh
          if-no-files-found: error
          retention-days: 14
